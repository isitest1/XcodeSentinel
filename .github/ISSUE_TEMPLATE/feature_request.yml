name: 機能要望
description: 新しい機能や改善を提案する
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どんな場面で困っているか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
  - type: checkboxes
    id: scope
    attributes:
      label: スコープの確認
      options:
        - label: これは Xcode の Claude 連携に関するものです（VS Code / ターミナルの Claude Code はスコープ外）
          required: true
        - label: これは利用量制限の回避を目的とするものではありません
          required: true
