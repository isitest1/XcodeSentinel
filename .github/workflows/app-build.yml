name: App build

# The macOS app lives under XcodeSentinel/ and can only be built on a macOS
# runner with Xcode (CLAUDE.md sections 4.1 and 15).

on:
  push:
    branches: [main]
    paths:
      - "XcodeSentinel/**"
      - "Packages/SentinelCore/**"
      - ".github/workflows/app-build.yml"
  pull_request:
    paths:
      - "XcodeSentinel/**"
      - "Packages/SentinelCore/**"
      - ".github/workflows/app-build.yml"

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build SentinelCore (SPM, sanity check on macOS too)
        run: swift build --package-path Packages/SentinelCore

      - name: Test SentinelCore (macOS runner)
        run: swift test --package-path Packages/SentinelCore --parallel

      - name: Build the app
        run: |
          xcodebuild \
            -project XcodeSentinel/XcodeSentinel.xcodeproj \
            -scheme XcodeSentinel \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
