name: Release

# Builds, signs, notarizes and publishes a DMG on a version tag.
# Signing and notarization require repository secrets:
#   APPLE_DEVELOPER_ID_CERT_BASE64, APPLE_DEVELOPER_ID_CERT_PASSWORD,
#   APPLE_TEAM_ID, APPLE_ID, APPLE_APP_PASSWORD
# See docs/xcode-handoff.md for setup instructions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # Pre-compute at job level so step if-conditions can use env context
      # (secrets context in step if-conditions causes workflow validation errors).
      HAS_CERTS: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: SentinelCore tests
        run: swift test --package-path Packages/SentinelCore --parallel

      - name: Build (Release, no signing)
        run: |
          xcodebuild \
            -project XcodeSentinel/XcodeSentinel.xcodeproj \
            -scheme xcode \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            DSTROOT=/tmp/xcs-install \
            install

      - name: Create unsigned DMG (always)
        run: |
          mkdir -p dist staging
          cp -R /tmp/xcs-install/Applications/xcode.app staging/XcodeSentinel.app
          ln -sf /Applications staging/Applications
          hdiutil create -volname XcodeSentinel \
            -srcfolder staging -ov -format UDZO dist/XcodeSentinel.dmg

      - name: Sign, notarize and replace DMG (requires secrets)
        if: env.HAS_CERTS == 'true'
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          APP=staging/XcodeSentinel.app
          # Find the imported Developer ID Application identity by fingerprint
          # (more reliable than matching by name substring).
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          echo "Signing with identity: $IDENTITY"
          codesign --force --deep --options runtime \
            --sign "$IDENTITY" "$APP"
          ditto -c -k --keepParent "$APP" XcodeSentinel.zip
          xcrun notarytool submit XcodeSentinel.zip \
            --apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          hdiutil create -volname XcodeSentinel \
            -srcfolder staging -ov -format UDZO dist/XcodeSentinel.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/XcodeSentinel.dmg
